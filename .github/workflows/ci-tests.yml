name: CI Tests

on:
  push:
    branches:
      - '**'
      - '!experimental*'
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore aqua-tools.slnx --locked-mode /bl:msbuild.restore.binlog

      - name: Build
        run: dotnet build aqua-tools.slnx --no-restore /bl:msbuild.build.binlog

      - name: Test
        run: >
          dotnet test aqua-tools.slnx --no-build /bl:msbuild.test.binlog `
            --results-directory TestResults `
            -- --report-trx

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msbuild_logs
          path: msbuild.*.binlog
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test_results
          path: TestResults/*
